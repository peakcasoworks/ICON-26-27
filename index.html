<div id="loader" hidden>
  <canvas id="ldCanvas" class="ld-canvas" aria-hidden="true"></canvas>
  <div class="ld-top">
    <div id="ldGear"></div>
    <div class="ld-name"><span id="ldName" class="wm" aria-label="ICON">ICON</span><span class="ld-sub">Rotaract District 3233, Chennai</span></div>
  </div>
  <div id="ldSky" class="ld-scene"></div>
  <button id="ldSkip" class="lnk">Skip</button>
</div>

<div class="demo-bar"><span>Concept prototype with sample data. No real member records are used.</span><button id="reset" class="lnk">Reset demo</button></div>
<div id="app">
  <aside id="side" class="side" aria-label="Sidebar"></aside>
  <div class="main">
    <header class="top">
      <a class="brand" href="#home" data-go="home" aria-label="Home"><span id="brandGear"></span><span id="seasonName" class="wm">ICON</span><span class="brand-sub">District 3233<small id="seasonYear">2027-28</small></span></a>
      <div class="top-act"><button id="searchBtn" class="search-btn" aria-label="Search the district"><svg class="ic" aria-hidden="true"><use href="#i-search"></use></svg><span>Search clubs, people, events</span><kbd>⌘K</kbd></button><button id="motionBtn" class="icon-btn" aria-label="Animations" aria-pressed="true"><svg class="ic" aria-hidden="true"><use href="#i-spark"></use></svg></button><button id="who" class="who" aria-label="Switch role"></button><button id="bell" class="bell" data-go="notifs" aria-label="Notifications"></button></div>
    </header>

  </div>
  <nav id="tabbar" class="tabbar" aria-label="Quick links"></nav>
</div>
